stages:
  - build
  - deploy

# Build Frontend
build_frontend:
  stage: build
  image: node:20
  script:
    - cd frontend
    - yarn install
    - yarn build
  artifacts:
    paths:
      - frontend/.next
  only:
    - branches  

#
deploy_application:
  stage: deploy
  before_script:
    - mkdir -p ~/.ssh
    - echo "$PRIVATE_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - echo -e "Host $SSH_HOST\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config
  
  script:
    - ssh -o StrictHostKeyChecking=no -p $PORT $SSH_USER@$SSH_HOST "
        cd $PROJECT_DIR && 
        git pull origin main && 
        cd $PROJECT_DIR/frontend && 
        yarn install && 
        yarn build && 
        sudo systemctl restart nginx && 
        cd $PROJECT_DIR/backend && 
        php artisan config:clear && 
        php artisan cache:clear && 
        sudo systemctl restart php-fpm && 
        sudo systemctl restart nginx
      "
  only:
    - ci/cd