3', {\r\n        chart: {\r\n            type: 'column'\r\n            },\r\n            title: {\r\n                text: title1\r\n            },\r\n            data: {\r\n                table: 'table3'\r\n            },\r\n         \r\n            yAxis: {\r\n                min: 0,\r\n                title: {\r\n                text: 'Number of facilities'\r\n                },\r\n                stackLabels: {\r\n                enabled: true,\r\n                style: {\r\n                    fontWeight: 'bold',\r\n                    color: (Highcharts.theme && Highcharts.theme.textColor) || 'gray'\r\n                }\r\n                }\r\n            },\r\n            legend: {\r\n                align: 'right',\r\n                x: -30,\r\n                verticalAlign: 'top',\r\n                y: 25,\r\n                floating: true,\r\n                backgroundColor: (Highcharts.theme && Highcharts.theme.background2) || 'white',\r\n                borderColor: '#CCC',\r\n                borderWidth: 1,\r\n                shadow: false\r\n            },\r\n            tooltip: {\r\n                \r\n                pointFormat: '{series.name}: {point.y}<br/>Total: {point.stackTotal}'\r\n            },\r\n            plotOptions: {\r\n                column: {\r\n                stacking: 'normal',\r\n                dataLabels: {\r\n                    enabled: true,\r\n                    color: (Highcharts.theme && Highcharts.theme.dataLabelsColor) || 'white'\r\n                }\r\n                }\r\n            },\r\n            credits: {\r\n                enabled: false\r\n            },\r\n  \r\n        });\r\n\r\n</script>\r\n\r\n    \r\n<script>\r\n        Highcharts.chart('ownership', {\r\n        chart: {\r\n            plotBackgroundColor: null,\r\n            plotBorderWidth: null,\r\n            plotShadow: false,\r\n            type: 'pie'\r\n        },\r\n        title: {\r\n            text: title2\r\n        },\r\n        tooltip: {\r\n            pointFormat: '{series.name}: <b>{point.percentage:.1f}%</b>'\r\n        },\r\n        plotOptions: {\r\n            pie: {\r\n            allowPointSelect: true,\r\n            cursor: 'pointer',\r\n            dataLabels: {\r\n                enabled: true,\r\n                format: '<b>{point.name}</b>: {point.percentage:.1f} %',\r\n                style: {\r\n                color: (Highcharts.theme && Highcharts.theme.contrastTextColor) || 'black'\r\n                }\r\n            }\r\n            }\r\n        },\r\n        series: [{\r\n            name: 'Facilities',\r\n            colorByPoint: true,\r\n            data: [{\"name\":1,\"y\":30778},{\"name\":2,\"y\":10953}]        }],\r\n        credits: {\r\n                    enabled: false\r\n                },\r\n        });\r\n\r\n</script>\r\n\r\n<script> \r\nHighcharts.chart('levels', {\r\n        chart: {\r\n            plotBackgroundColor: null,\r\n            plotBorderWidth: null,\r\n            plotShadow: false,\r\n            type: 'pie'\r\n        },\r\n        title: {\r\n            text: title3\r\n        },\r\n        tooltip: {\r\n            pointFormat: '{series.name}: <b>{point.percentage:.1f}%</b>'\r\n        },\r\n        plotOptions: {\r\n            pie: {\r\n            allowPointSelect: true,\r\n            cursor: 'pointer',\r\n            dataLabels: {\r\n                enabled: true,\r\n                format: '<b>{point.name}</b>: {point.percentage:.1f} %',\r\n                style: {\r\n                color: (Highcharts.theme && Highcharts.theme.contrastTextColor) || 'black'\r\n                }\r\n            }\r\n            }\r\n        },\r\n        series: [{\r\n            name: 'Facilities',\r\n            colorByPoint: true,\r\n            data: [{\"name\":1,\"y\":36669},{\"name\":2,\"y\":4856},{\"name\":3,\"y\":206}]        }],\r\n        credits: {\r\n                    enabled: false\r\n                },\r\n        });\r\n        \r\n</script>\r\n\r\n</body>\r\n\r\n</html>"
      tags:
