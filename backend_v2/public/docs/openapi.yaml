                          >Niger</option>\r\n                                                                    <option value=\"127\"\r\n                                        >Ogun</option>\r\n                                                                    <option value=\"128\"\r\n                                        >Ondo</option>\r\n                                                                    <option value=\"129\"\r\n                                        >Osun</option>\r\n                                                                    <option value=\"130\"\r\n                                        >Oyo</option>\r\n                                                                    <option value=\"131\"\r\n                                        >Plateau</option>\r\n                                                                    <option value=\"132\"\r\n                                        >Rivers</option>\r\n                                                                    <option value=\"133\"\r\n                                        >Sokoto</option>\r\n                                                                    <option value=\"134\"\r\n                                        >Taraba</option>\r\n                                                                    <option value=\"135\"\r\n                                        >Yobe</option>\r\n                                                                    <option value=\"136\"\r\n                                        >Zamfara</option>\r\n                                                            </select>\r\n                        </div>\r\n\r\n                        <div class=\"col-sm-3\">\r\n                            <select class=\"form-control select2\" id=\"lga_id\" name=\"lga_id\">\r\n                                <option value=\"1\" selected>--Select LGA--</option>\r\n                            </select>\r\n                        </div>\r\n                        <div class=\"col-sm-2\">\r\n                            <select class=\"form-control select2\" id=\"ward_id\" name=\"ward_id\">\r\n                                <option value=\"0\" selected>--Select Ward--</option>\r\n                            </select>\r\n                        </div>\r\n\r\n\r\n                        <div class=\"col-sm-2\">\r\n                            <select class=\"form-control select2\" id=\"facility_level_id\" name=\"facility_level_id\"\r\n                                style=\"width: 100%;\">\r\n                                <option value=\"0\">--Select Facility Level--</option>\r\n                                                                    <option value=\"1\"\r\n                                        >Primary\r\n                                    </option>\r\n                                                                    <option value=\"2\"\r\n                                        >Secondary\r\n                                    </option>\r\n                                                                    <option value=\"3\"\r\n                                        >Tertiary\r\n                                    </option>\r\n                                                            </select>\r\n                        </div>\r\n\r\n                        <div class=\"col-sm-2\">\r\n                            <select class=\"form-control select2\" id=\"ownership_id\" name=\"ownership_id\" style=\"width: 100%;\">\r\n                                <option value=\"0\">--Select Ownership--</option>\r\n                                                                    <option value=\"1\"\r\n                                        >Public\r\n                                    </option>\r\n                                                                    <option value=\"2\"\r\n                                        >Private\r\n                                    </option>\r\n                                \r\n                            </select>\r\n                        </div>\r\n\r\n                    </div>\r\n                    <div class=\"form-group\">\r\n\r\n                        <div class=\"col-sm-3\">\r\n                            <select class=\"form-control select2\" id=\"operational_status_id\" name =\"operational_status_id\">\r\n                                <option value=\"0\">--Select Operational Status--</option>\r\n                                                                    <option value=\"1\"\r\n                                        >\r\n                                        Operational</option>\r\n                                                                    <option value=\"3\"\r\n                                        >\r\n                                        Pending Operation (Construction Complete)</option>\r\n                                                                    <option value=\"4\"\r\n                                        >\r\n                                        Pending Operation (Under Construction)</option>\r\n                                                                    <option value=\"5\"\r\n                                        >\r\n                                        Closed (Temporary)</option>\r\n                                                                    <option value=\"6\"\r\n                                        >\r\n                                        Closed</option>\r\n                                                            </select>\r\n                        </div>\r\n                        <div class=\"col-sm-3\">\r\n                            <select class=\"form-control select2\" id=\"registration_status_id\" name=\"registration_status_id\"\r\n                                style=\"width: 100%;\">\r\n                                <option value=\"0\">--Select Registration Status--</option>\r\n                                                                    <option value=\"1\"\r\n                                        >\r\n                                        Provisionally Registered</option>\r\n                                                                    <option value=\"2\"\r\n                                        >\r\n                                        Registered</option>\r\n                                                                    <option value=\"3\"\r\n                                        >\r\n                                        Registration Suspended</option>\r\n                                                                    <option value=\"4\"\r\n                                        >\r\n                                        Registration Cancelled</option>\r\n                                                                    <option value=\"5\"\r\n                                        >\r\n                                        Pending Registration</option>\r\n                                                                    <option value=\"6\"\r\n                                        >\r\n                                        Not Applicable</option>\r\n                                                                    <option value=\"7\"\r\n                                        >\r\n                                        Unknown</option>\r\n                                                            </select>\r\n                        </div>\r\n                        <div class=\"col-sm-2\">\r\n                            <select class=\"form-control select2\" id=\"license_status_id\" name=\"license_status_id\"\r\n                                style=\"width: 100%;\">\r\n                                <option value=\"0\">--Select License Status--</option>\r\n                                                                    <option value=\"1\"\r\n                                        >Licensed\r\n                                    </option>\r\n                                                                    <option value=\"2\"\r\n                                        >Not Licensed\r\n                                    </option>\r\n                                                                    <option value=\"3\"\r\n                                        >License Cancelled\r\n                                    </option>\r\n                                                                    <option value=\"4\"\r\n                                        >Not Applicable\r\n                                    </option>\r\n                                                                    <option value=\"5\"\r\n                                        >Unknown\r\n                                    </option>\r\n                                                            </select>\r\n                        </div>\r\n                        <div class=\"col-sm-2\">\r\n                            <select class=\"form-control select2\" id=\"geo_codes\" name=\"geo_codes\">\r\n                                <option value=\"0\">--Select Coordinates--</option>\r\n                                <option value=\"1\" >With Coordinates\r\n                                </option>\r\n                                <option value=\"2\" >With No\r\n                                    Coordinates</option>\r\n                            </select>\r\n                        </div>\r\n                        <div class=\"col-sm-2\">\r\n                            <select class=\"form-control select2\" id=\"service_type\" name=\"service_type\">\r\n                                <option value=\"0\">--Select Service Type--</option>\r\n                                <option value=\"1\" >Out Patient\r\n                                </option>\r\n                                <option value=\"2\" >In Patient\r\n                                </option>\r\n                           