\n                $.ajax({\r\n                    url:\"http://localhost/hosp/fetchLga\",\r\n                    method:\"POST\",\r\n                    data:{id:stateID, _token:_token},\r\n                    success:function(result)\r\n                    {\r\n                        $('#lga_id').html(result);\r\n                    }         \r\n                })\r\n            }\r\n        });\r\n           //if lga change fill wards\r\n           $('#lga_id').change(function(){\r\n            if($(this).val() != '')\r\n            {\r\n                var lgaID= $('#lga_id').val();\r\n                var _token = $('input[name=\"_token\"]').val();\r\n                $.ajax({\r\n                    url:\"http://localhost/hosp/fetctWards\",\r\n                    method:\"POST\",\r\n                    data:{lgaId:lgaID,_token:_token},\r\n                    success:function(result)\r\n                    {\r\n                        $('#ward_id').html(result);\r\n                    }         \r\n                })\r\n            }\r\n        });\r\n         \r\n        \r\n        // $('#state').change(function(){\r\n        //     $('#lga').val('');\r\n        //     $('#lga')\r\n        //     .find('option')\r\n        //     .remove()\r\n        //     .end();\r\n        //     $('#ward')\r\n        //     .find('option')\r\n        //     .remove()\r\n        //     .end();\r\n        // });\r\n        \r\n        // $('#lga').change(function(){\r\n        //     $('#ward')\r\n        //     .find('option')\r\n        //     .remove()\r\n        //     .end();\r\n        // });\r\n        \r\n       \r\n\r\n\r\n    });\r\n</script>\r\n<script>\r\n    $(document).ready( function () {\r\n               \r\n        //get lgas\r\n        if(1 == 1){\r\n            var stateID = ;\r\n            var _token = $('input[name=\"_token\"]').val();\r\n            $.ajax({\r\n                url:\"http://localhost/hosp/fetchLga\",\r\n                method:\"POST\",\r\n                data:{id:stateID, _token:_token},\r\n                success:function(result)    \r\n                {\r\n                    $('#lga_id').html(result);\r\n                    $(\"#lga_id\").val().change();               \r\n                }         \r\n            });\r\n            \r\n            \r\n        }   \r\n        \r\n        //get wards\r\n        if( != ''){\r\n            var lgaID = ;\r\n            var _token = $('input[name=\"_token\"]').val();\r\n            $.ajax({\r\n                url:\"http://localhost/hosp/fetctWards\",\r\n                method:\"POST\",\r\n                data:{lgaId:lgaID,_token:_token},\r\n                success:function(result)\r\n                {\r\n                    $('#ward_id').html(result);\r\n                    $('#ward_id').val().change();\r\n                }         \r\n            });\r\n        }\r\n        \r\n        $(\"#service_category_id\").change(function(){\r\n            var id= $('#service_category_id').val();\r\n            var _token = $('input[name=\"_token\"]').val();\r\n            $.ajax({\r\n                url:\"http://localhost/hosp/services\",\r\n                method:\"POST\",\r\n                data:{id:id, _token:_token},\r\n                success:function(result)\r\n                {\r\n                    $('#services').html(result);\r\n                }         \r\n            })\r\n        });\r\n        \r\n        \r\n        $(\"#reset\").click(function(){\r\n            $(\"#geo_codes\").val(0).change();\r\n            $(\"#state_id\").val(1).change();\r\n            $(\"#facility_name\").val(\"\");\r\n            $(\"#ownership_id\").val(0).change();\r\n            $(\"#operational_status_id\").val(0).change();\r\n            $(\"#registration_status_id\").val(0).change();\r\n            $(\"#license_status_id\").val(0).change();\r\n        });\r\n        \r\n        \r\n        $('#view_details').on('show.bs.modal', function (event) {\r\n          