             </div>\r\n                                        </div>\r\n\r\n                                    </div>\r\n                                </div>\r\n                        </div>\r\n              \r\n                <!--Footer Area Start-->\r\n                <footer class=\"footer-area\">\r\n                    <div class=\"container\">\r\n                        <div class=\"row\">\r\n                            <div class=\"col-md-6 col-sm-7\">\r\n                                <span>Copyright &copy; 2018 <a href=\"http://health.gov.ng/\">Federal Ministry of Health</a>. All Right Reserved </span>\r\n                            </div>\r\n                            <div class=\"col-md-4\">\r\n                                \r\n                            </div>\r\n                            <div class=\"col-md-2 col-sm-2\">\r\n                                    <span>Version 2.0 </span>\r\n                            </div>\r\n                            \r\n                        </div>\r\n                    </div>\r\n                </footer>\r\n                <!--End of Footer Area-->\r\n            </div>   \r\n            <!--End of Bg White--> \r\n        </div>    \r\n        <!--End of Main Wrapper Area--> \r\n        \r\n\r\n\r\n\r\n\r\n\r\n        <script src=\"http://localhost/design/js/vendor/jquery-1.12.4.min.js\"></script>\r\n        <script src=\"http://localhost/design/js/bootstrap.min.js\"></script>\r\n        <script src=\"http://localhost/design/js/jquery.meanmenu.js\"></script>        \t\r\n        <script src=\"http://localhost/design/js/wow.min.js\"></script>\r\n        \r\n        \r\n        <script src=\"http://localhost/dist/js/select2.full.min.js\"></script>\r\n        <script src=\"http://localhost/design/js/main.js\"></script>\r\n\r\n\r\n        <script>\r\n    \r\n            $('.select2').select2() \r\n\r\n        </script>\r\n\r\n            <script src=\"http://localhost/hcharts/chart/highcharts.js\"></script>\r\n    <script src=\"http://localhost/hcharts/chart/exporting.js\"></script>\r\n    <script src=\"http://localhost/hcharts/chart/data.js\"></script>\r\n    <script src=\"http://localhost/hcharts/chart/offline-exporting.js\"></script>   \r\n    \r\n    <script>\r\n    $(document).ready(function(){\r\n        //if state change fill lga\r\n        $('#state_id').change(function(){\r\n            if($(this).val() != '')\r\n            {\r\n                var stateID= $('#state_id').val();\r\n                var _token = $('input[name=\"_token\"]').val();\r\n                $.ajax({\r\n                    url:\"http://localhost/hosp/fetchLga\",\r\n                    method:\"POST\",\r\n                    data:{id:stateID, _token:_token},\r\n                    success:function(result)\r\n                    {\r\n                        $('#lga_id').html(result);\r\n                    }         \r\n                })\r\n            }\r\n        });\r\n           \r\n\r\n\r\n    });\r\n</script>\r\n    \r\n<script>\r\n\r\n    $(\"#state_id\").val(0).change();\r\n    $(\"#facility_type_id\").val(1).change();\r\n\r\n    //set message after filter\r\n    $(\"#filtermessage\").text(\"Statistics Summary of \"+ $(\"#facility_type_id :selected\").text() + \" in \"+  $(\"#state_id :selected\").text() + \" State\");\r\n    \r\n    if($(\"#facility_type_id\").val()==1){\r\n        var title1 = \"Hospitals and Clinics by Level of Care\";\r\n        var title2 = \"Percentage of Hospitals and Clinics by Ownership\";\r\n        var title3 = \"Percentage of Hospitals and Clinics by Level of Care\";\r\n    }\r\n    if($(\"#facility_type_id\").val()==3){\r\n        var title1 = \"Laboratory Premises by Level of Care\";\r\n        var title2 = \"Percentage of Laboratory Premises by Ownership\";\r\n        var title3 = \"Percentage of Laboratory Premises by Level of Care\";\r\n    }\r\n//Chart 1\r\n        $('#table3').hide();\r\n        \r\n        Highcharts.chart('container3', {\r\n        chart: {\r\n            type: 'column'\r\n            },\r\n            title: {\r\n                text: title1\r\n            },\r\n            data: {\r\n                table: 'table3'\r\n            },\r\n         \r\n            yAxis: {\r\n                min: 0,\r\n                title: {\r\n                text: 'Number of facilities'\r\n                },\r\n                stackLabels: {\r\n                enabled: true,\r\n                style: {\r\n                    fontWeight: 'bold',\r\n                    color: (Highcharts.theme && Highcharts.theme.textColor) || 'gray'\r\n                }\r\n                }\r\n            },\r\n            legend: {\r\n                align: 'right',\r\n                x: -30,\r\n                verticalAlign: 'top',\r\n                y: 25,\r\n                floating: true,\r\n                backgroundColor: (Highcharts.theme && Highcharts.theme.background2) || 'white',\r\n                borderColor: '#CCC',\r\n                borderWidth: 1,\r\n                shadow: false\r\n            },\r\n            tooltip: {\r\n                \r\n                pointFormat: '{series.name}: {point.y}<br/>Total: {point.stackTotal}'\r\n            },\r\n            plotOptions: {\r\n                column: {\r\n                stacking: 'normal',\r\n                dataLabels: {\r\n                    enabled: true,\r\n                    color: (Highcharts.theme && Highcharts.theme.dataLabelsColor) || 'white'\r\n                }\r\n                }\r\n            },\r\n            credits: {\r\n                enabled: false\r\n            },\r\n  \r\n        });\r\n\r\n</script>\r\n\r\n    \r\n<script>\r\n        Highcharts.chart('ownership', {\r\n        chart: {\r\n            plotBackgroundColor: null,\r\n            plotBorderWidth: null,\r\n            plotShadow: false,\r\n            type: 'pie'\r\n        },\r\n        title: {\r\n            text: title2\r\n        },\r\n        tooltip: {\r\n            pointFormat: '{series.name}: <b>{point.percentage:.1f}%</b>'\r\n        },\r\n        plotOptions: {\r\n            pie: {\r\n            allowPointSelect: true,\r\n            cursor: 'pointer',\r\n            dataLabels: {\r\n                enabled: true,\r\n                format: '<b>{point.name}</b>: {point.percentage:.1f} %',\r\n                style: {\r\n                color: (Highcharts.theme && Highcharts.theme.contrastTextColor) || 'black'\r\n                }\r\n            }\r\n            }\r\n        },\r\n        series: [{\r\n            name: 'Facilities',\r\n            colorByPoint: true,\r\n            data: [{\"name\":1,\"y\":30778},{\"name\":2,\"y\":10953}]        }],\r\n        credits: {\r\n                    enabled: false\r\n                },\r\n        });\r\n\r\n</script>\r\n\r\n<script> \r\nHighcharts.chart('levels', {\r\n        chart: {\r\n            plotBackgroundColor: null,\r\n            plotBorderWidth: null,\r\n            plotShadow: false,\r\n            type: 'pie'\r\n        },\r\n        title: {\r\n            text: title3\r\n        },\r\n        tooltip: {\r\n            pointFormat: '{series.name}: <b>{point.percentage:.1f}%</b>'\r\n        },\r\n        plotOptions: {\r\n            pie: {\r\n            allowPointSelect: true,\r\n            cursor: 'pointer',\r\n            dataLabels: {\r\n                enabled: true,\r\n                format: '<b>{point.name}</b>: {point.percentage:.1f} %',\r\n                style: {\r\n                color: (Highcharts.theme && Highcharts.theme.contrastTextColor) || 'black'\r\n                }\r\n            }\r\n            }\r\n        },\r\n        series: [{\r\n            name: 'Facilities',\r\n            colorByPoint: true,\r\n            data: [{\"name\":1,\"y\":36669},{\"name\":2,\"y\":4856},{\"name\":3,\"y\":206}]        }],\r\n        credits: {\r\n                    enabled: false\r\n                },\r\n        });\r\n        \r\n</script>\r\n\r\n</body>\r\n\r\n</html>"
