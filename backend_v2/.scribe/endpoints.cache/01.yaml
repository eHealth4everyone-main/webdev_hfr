iv class=\"col-sm-3\">\r\n                        <select class=\"form-control select2\" id=\"geo_codes\" name=\"geo_codes\">\r\n                            <option value=\"0\">--Select Coordinates--</option>\r\n                            <option value=\"1\" >With Coordinates</option>\r\n                            <option value=\"2\" >With No Coordinates</option>                            \r\n                        </select>\r\n                    </div>\r\n                \r\n                    \r\n                    \r\n                    \r\n                </div>\r\n                <div class=\"form-group\">\r\n               \r\n                 \r\n                    <div class=\"col-sm-9\" >\r\n                        <input class=\"form-control input-sm\"type=\"text\" name=\"facility_name\" id=\"facility_name\" class=\"form-control\" placeholder=\"Radiology/Imaging facility name\">\r\n                    </div>\r\n                    \r\n                    <div class=\"col-sm-3\">\r\n                        <div class=\"form-group\">\r\n                            <div class=\"col-sm-6\">\r\n                                <button type=\"button\" class=\"btn btn-sm pull-right btn-block\" id='reset'>Reset</button>\r\n                            </div>\r\n                            <div class=\"col-sm-6\">\r\n                                <button type=\"submit\" class=\"btn btn-success btn-block btn-sm\">Search</button>\r\n                            </div>\r\n                        </div>\r\n                    </div>\r\n                </div>\r\n                \r\n            </form>\r\n            \r\n            \r\n            \r\n        </div>\r\n        \r\n        <div class=\"box-body\">                \r\n                                    <div role=\"alert\" class=\"alert alert-success\"> \r\n                        No records found!\r\n                    </div>\r\n                     \r\n        \r\n    </div>\r\n    <!-- /.box-body -->\r\n    <div class=\"box-footer\">\r\n        <div class=\"row\">\r\n            \r\n                        \r\n        </div>\r\n    </div>\r\n</div> <!-- /contanier-->\r\n</div> <!-- / -->\r\n\r\n\r\n\r\n                    \r\n                \r\n                <!--End of Text Area-->\r\n                           <!--Footer Widget Area Start-->\r\n                           <div class=\"footer-widget-area\">\r\n                                <div class=\"container\">\r\n                                    <div class=\"row\">\r\n                                  \r\n                                        <div class=\"col-md-4 col-sm-4\">\r\n                                            <div class=\"single-footer-widget\">\r\n                                                <h3>Nigeria HFR PARTNERS</h3>\r\n                                                <div class=\"instagram-image\">\r\n                                                       \r\n                                                        <div class=\"footer-img\">\r\n                                                            <img src=\"http://localhost/img/nigeria_logo.jpg\" height=\"70\" width=\"70\" alt=\"FMOH\">\r\n                                                        </div>\r\n                                                        <div class=\"footer-img\">\r\n                                                                <img src=\"http://localhost/img/usaid.png\" height=\"70\" width=\"70\" alt=\"USAID\">\r\n                                                        </div>\r\n                                                        <div class=\"footer-img\">\r\n                                                                <img src=\"http://localhost/img/measure.jpg\" height=\"70\" width=\"70\" alt=\"MEASURE Evaluation\">\r\n                                                        </div>\r\n                                                </div>\r\n                                         